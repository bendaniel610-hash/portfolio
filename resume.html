<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benedict Thomas R — Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #000000;
  color: #fff;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: 40px 20px 80px;
}

/* ── LIVE GRADIENT & GRAIN BACKGROUND ── */
.grain-overlay {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: 9998;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}
.live-bg-container {
  position: fixed;
  inset: 0;
  z-index: -2;
  background: radial-gradient(circle at 50% 50%, #010603 0%, #000000 100%);
  overflow: hidden;
}
.live-bg-gradient {
  position: absolute;
  border-radius: 50%;
  filter: blur(140px);
  opacity: 0.12;
  pointer-events: none;
  will-change: transform;
}
.bg-blob-1 {
  width: 50vw; height: 50vw;
  background: radial-gradient(circle, rgba(16, 185, 129, 0.07) 0%, rgba(57, 255, 20, 0.02) 45%, transparent 75%);
  left: -10%; top: 10%;
  animation: floatBlob1 25s infinite alternate ease-in-out;
}
.bg-blob-2 {
  width: 45vw; height: 45vw;
  background: radial-gradient(circle, rgba(0, 255, 128, 0.06) 0%, rgba(0, 100, 50, 0.01) 50%, transparent 75%);
  right: -5%; bottom: 10%;
  animation: floatBlob2 20s infinite alternate ease-in-out -5s;
}
@keyframes floatBlob1 {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(6vw, -8vh) scale(1.1); }
  100% { transform: translate(-4vw, 6vh) scale(0.95); }
}
@keyframes floatBlob2 {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-6vw, 8vh) scale(1.05); }
  100% { transform: translate(4vw, -6vh) scale(0.95); }
}

/* ── NAV & UTILITIES ── */
.top-actions {
  max-width: 900px;
  margin: 0 auto 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  padding: 10px 20px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(168, 216, 176, 0.25);
  border-radius: 100px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
}
.back-link:hover {
  background: #a8d8b0;
  color: #111;
  border-color: #a8d8b0;
  transform: translateX(-4px);
  box-shadow: 0 4px 25px rgba(168, 216, 176, 0.3);
}
.back-link svg {
  transition: transform 0.25s ease;
}
.back-link:hover svg {
  transform: translateX(-2px);
}
.action-buttons {
  display: flex;
  align-items: center;
  gap: 12px;
}
.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: rgba(255, 255, 255, 0.85);
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 10px 20px;
  border-radius: 100px;
  font-weight: 500;
  font-size: 14px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  text-decoration: none;
}
.action-btn:hover {
  color: #fff;
  border-color: rgba(168, 216, 176, 0.4);
  background: rgba(168, 216, 176, 0.05);
  box-shadow: 0 4px 20px rgba(168, 216, 176, 0.15);
  transform: translateY(-1px);
}

/* ── RESUME VIEWER ── */
.resume-viewer-container {
  max-width: 900px;
  margin: 0 auto;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(168, 216, 176, 0.03);
  border: 1px solid rgba(168, 216, 176, 0.15);
  background: rgba(10, 10, 10, 0.5);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
  position: relative;
}
.resume-viewer-container:hover {
  transform: translateY(-4px);
  border-color: rgba(168, 216, 176, 0.3);
  box-shadow: 0 35px 70px rgba(0,0,0,0.7), 0 0 50px rgba(168, 216, 176, 0.1);
}
.resume-image-styled {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 23px;
  filter: contrast(1.02) saturate(1.01);
}

.interactive-help {
  text-align: center;
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.4);
  margin-top: 24px;
  letter-spacing: 0.05em;
  animation: pulseHelp 2s infinite alternate ease-in-out;
}
@keyframes pulseHelp {
  0% { opacity: 0.4; }
  100% { opacity: 0.8; }
}

/* ── RESPONSIVENESS ── */
@media (max-width: 768px) {
  body {
    padding: 20px 10px 40px;
  }
  .top-actions {
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }
  .back-link {
    justify-content: center;
  }
  .action-buttons {
    justify-content: center;
  }
}

/* ── PERFECT PRINT CONFIGURATION ── */
@media print {
  body {
    background: #fff !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .grain-overlay, .live-bg-container, .top-actions, .interactive-help {
    display: none !important;
  }
  .resume-viewer-container {
    border: none !important;
    box-shadow: none !important;
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
    max-width: 100% !important;
    transform: none !important;
  }
  .resume-image-styled {
    width: 100% !important;
    height: auto !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    display: block !important;
  }
}
</style>
</head>
<body>

<div class="grain-overlay"></div>

<!-- Live Shifting Background Gradients -->
<div class="live-bg-container">
  <div class="live-bg-gradient bg-blob-1"></div>
  <div class="live-bg-gradient bg-blob-2"></div>
</div>

<!-- Back Link & Action Navigation -->
<div class="top-actions">
  <a href="./benedict_portfolio_1.html" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    Back to Portfolio
  </a>
  <div class="action-buttons">
    <a href="Benedict_Thomas_R_Resume.pdf" download="Benedict_Thomas_R_Resume.pdf" class="action-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Download Resume
    </a>
    <button class="action-btn" onclick="window.print()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
      Print Resume
    </button>
  </div>
</div>

<!-- Main Resume Interactive Viewer -->
<div class="resume-viewer-container">
  <img src="resume.jpg" alt="Benedict Thomas R — Resume" class="resume-image-styled">
</div>

<div class="interactive-help">
  [press ctrl+p to print or save as pdf]
</div>

</body>
</html>
