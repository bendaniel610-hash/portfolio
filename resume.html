<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benedict Thomas R — Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --accent-color: #c084fc;
  --accent-glow: rgba(168, 85, 247, 0.3);
  --accent-glow-subtle: rgba(168, 85, 247, 0.15);
}
[data-theme="cyan"] {
  --accent-color: #22d3ee;
  --accent-glow: rgba(8, 145, 178, 0.3);
  --accent-glow-subtle: rgba(8, 145, 178, 0.15);
}
[data-theme="amber"] {
  --accent-color: #fbbf24;
  --accent-glow: rgba(217, 119, 6, 0.3);
  --accent-glow-subtle: rgba(217, 119, 6, 0.15);
}

body {
  font-family: 'DM Sans', sans-serif;
  background: #000000;
  color: #fff;
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  padding: 40px 20px 80px;
}

/* ── LIVE GRADIENT & GRAIN BACKGROUND ── */
.grain-overlay {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: 9998;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}
.live-bg-container {
  position: fixed;
  inset: 0;
  z-index: -2;
  background: radial-gradient(circle at 50% 50%, #04020f 0%, #000000 100%);
  overflow: hidden;
}
.live-bg-gradient {
  position: absolute;
  border-radius: 50%;
  filter: blur(140px);
  opacity: 0.12;
  pointer-events: none;
  will-change: transform;
}
.bg-blob-1 {
  width: 50vw; height: 50vw;
  background: radial-gradient(circle, rgba(139, 92, 246, 0.08) 0%, rgba(236, 72, 153, 0.03) 45%, transparent 75%);
  left: -10%; top: 10%;
  animation: floatBlob1 25s infinite alternate ease-in-out;
}
.bg-blob-2 {
  width: 45vw; height: 45vw;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.07) 0%, rgba(59, 130, 246, 0.02) 50%, transparent 75%);
  right: -5%; bottom: 10%;
  animation: floatBlob2 20s infinite alternate ease-in-out -5s;
}
@keyframes floatBlob1 {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(6vw, -8vh) scale(1.1); }
  100% { transform: translate(-4vw, 6vh) scale(0.95); }
}
@keyframes floatBlob2 {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-6vw, 8vh) scale(1.05); }
  100% { transform: translate(4vw, -6vh) scale(0.95); }
}

/* ── NAV & UTILITIES ── */
.top-actions {
  max-width: 900px;
  margin: 0 auto 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  padding: 10px 20px;
  background: rgba(10, 8, 25, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 100px;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
}
.back-link:hover {
  background: var(--accent-color);
  color: #111;
  border-color: var(--accent-color);
  transform: translateX(-4px);
  box-shadow: 0 15px 30px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.back-link svg {
  transition: transform 0.25s ease;
}
.back-link:hover svg {
  transform: translateX(-2px);
}
.action-buttons {
  display: flex;
  align-items: center;
  gap: 12px;
}
.action-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: rgba(255, 255, 255, 0.85);
  background: rgba(10, 8, 25, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.09);
  padding: 10px 20px;
  border-radius: 100px;
  font-weight: 500;
  font-size: 14px;
  cursor: pointer;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  text-decoration: none;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.12);
}
.action-btn:hover {
  color: #fff;
  border-color: var(--accent-color);
  background: var(--accent-glow-subtle);
  box-shadow: 0 15px 30px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  transform: translateY(-2px);
}

/* ── RESUME VIEWER ── */
.resume-viewer-container {
  max-width: 900px;
  margin: 0 auto;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 40px 80px rgba(0,0,0,0.65), 0 0 40px rgba(168, 85, 247, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.09);
  background: rgba(10, 8, 25, 0.45);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease, box-shadow 0.4s ease;
  position: relative;
  overflow: hidden;
  cursor: grab;
}
.resume-viewer-container:active {
  cursor: grabbing;
}
.resume-viewer-container:hover {
  transform: translateY(-4px);
  border-color: var(--accent-color);
  box-shadow: 0 45px 90px rgba(0,0,0,0.75), 0 0 50px var(--accent-glow), inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.resume-image-styled {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 23px;
  filter: contrast(1.02) saturate(1.01);
  transform-origin: center center;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: transform;
}

/* ── VIEWER TABS ── */
.viewer-tabs {
  max-width: fit-content;
  margin: 0 auto 24px;
  display: flex;
  background: rgba(10, 8, 25, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 5px;
  border-radius: 100px;
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  box-shadow: 0 16px 35px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.tab-btn {
  background: transparent;
  border: 1px solid transparent;
  color: rgba(255, 255, 255, 0.55);
  padding: 10px 24px;
  border-radius: 100px;
  font-weight: 500;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  outline: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.tab-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.04);
}
.tab-btn.active {
  color: var(--accent-color);
  background: var(--accent-glow-subtle);
  border-color: rgba(255, 255, 255, 0.05);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  font-weight: 600;
}

/* ── PDF VIEW CONTROLS ── */
.pdf-iframe-container {
  display: block;
}
.pdf-mobile-fallback {
  display: none;
  padding: 60px 24px;
  text-align: center;
}
.fallback-card {
  max-width: 480px;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.06);
  padding: 40px 24px;
  border-radius: 20px;
  box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
}
.fallback-icon {
  font-size: 48px;
  margin-bottom: 16px;
}
.fallback-card h3 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #fff;
}
.fallback-card p {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.5);
  margin-bottom: 24px;
  line-height: 1.5;
}
.primary-btn {
  background: var(--accent-color) !important;
  color: #111 !important;
  font-weight: 600 !important;
  border-color: var(--accent-color) !important;
  box-shadow: 0 10px 20px var(--accent-glow) !important;
}
.primary-btn:hover {
  background: #fff !important;
  color: #111 !important;
  border-color: #fff !important;
}

@media (max-width: 768px) {
  .pdf-iframe-container {
    display: none !important;
  }
  .pdf-mobile-fallback {
    display: block !important;
  }
}

/* Floating Zoom controls */
.resume-zoom-controls {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: rgba(10, 8, 25, 0.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.09);
  padding: 8px;
  border-radius: 100px;
  display: flex;
  gap: 8px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
  z-index: 100;
}
.zoom-btn {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: #fff;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  font-family: 'Space Mono', monospace;
  padding: 0;
  outline: none;
}
.zoom-btn:hover {
  background: #fff;
  color: #111;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px var(--accent-glow);
}
.zoom-btn.reset {
  font-size: 13px;
}

@media print {
  .resume-zoom-controls {
    display: none !important;
  }
}

.interactive-help {
  text-align: center;
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  color: rgba(255, 255, 255, 0.4);
  margin-top: 24px;
  letter-spacing: 0.05em;
  animation: pulseHelp 2s infinite alternate ease-in-out;
}
@keyframes pulseHelp {
  0% { opacity: 0.4; }
  100% { opacity: 0.8; }
}

/* ── RESPONSIVENESS ── */
@media (max-width: 768px) {
  body {
    padding: 20px 10px 40px;
  }
  .top-actions {
    flex-direction: column;
    align-items: stretch;
    gap: 16px;
  }
  .back-link {
    justify-content: center;
  }
  .action-buttons {
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .action-btn {
    padding: 10px 16px;
    font-size: 13px;
    flex: 1 1 auto;
    justify-content: center;
  }
  .viewer-tabs {
    flex-direction: row;
    max-width: calc(100% - 20px);
    margin: 0 auto 20px;
    padding: 4px;
    border-radius: 100px;
    gap: 4px;
  }
  .tab-btn {
    padding: 8px 16px;
    font-size: 12px;
    flex: 1 1 50%;
  }
}

/* ── PERFECT PRINT CONFIGURATION ── */
@media print {
  body {
    background: #fff !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .grain-overlay, .live-bg-container, .top-actions, .interactive-help {
    display: none !important;
  }
  .resume-viewer-container {
    border: none !important;
    box-shadow: none !important;
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
    max-width: 100% !important;
    transform: none !important;
  }
  .resume-image-styled {
    width: 100% !important;
    height: auto !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    display: block !important;
  }
}
</style>
</head>
<body>

<div class="grain-overlay"></div>

<!-- Live Shifting Background Gradients -->
<div class="live-bg-container">
  <div class="live-bg-gradient bg-blob-1"></div>
  <div class="live-bg-gradient bg-blob-2"></div>
</div>

<!-- Back Link & Action Navigation -->
<div class="top-actions">
  <a href="index.html" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>

    </a>

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>

<!-- Viewer Tabs Switcher -->

    Creative Graphic Resume
  </button>
  <button class="tab-btn" onclick="switchViewerTab('pdf')">

<!-- Main Resume Interactive Viewer -->

  <div class="resume-viewer-content active" id="png-content">
    <img src="resume.png" alt="Benedict Thomas R — Resume" class="resume-image-styled" draggable="false">
  </div>
  <div class="resume-viewer-content" id="pdf-content" style="display: none;">
    <!-- PDF Desktop Iframe Viewport -->
    <div class="pdf-iframe-container">
      <iframe src="Benedict_Thomas_R_Resume.pdf" class="pdf-iframe" style="width:100%; height:1100px; border:none; border-radius:23px; display:block;"></iframe>

        <div class="fallback-icon">📄</div>
        <h3>Benedict_Thomas_R_Resume.pdf</h3>
        <p>PDF documents are optimized for direct downloads on mobile devices.</p>
        <a href="Benedict_Thomas_R_Resume.pdf" download="Benedict_Thomas_R_Resume.pdf" class="action-btn primary-btn" style="justify-content: center; width: 100%;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px; display: inline-block; vertical-align: middle;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Download PDF Document

<!-- Floating Zoom Controls -->
<div class="resume-zoom-controls">
  <button class="zoom-btn" onclick="adjustZoom(0.15)" title="Zoom In">+</button>
  <button class="zoom-btn" onclick="adjustZoom(-0.15)" title="Zoom Out">−</button>
  <button class="zoom-btn reset" onclick="resetZoom()" title="Reset Zoom">⟲</button>
</div>

<div class="interactive-help">
  [press ctrl+p to print or save as pdf]
</div>

<script>
// Load theme on startup
const savedTheme = localStorage.getItem('portfolio-theme') || 'violet';
if (savedTheme !== 'violet') {
  document.documentElement.setAttribute('data-theme', savedTheme);
}

// Zoom and Drag viewer state logic
const container = document.querySelector('.resume-viewer-container');
const img = document.querySelector('.resume-image-styled');

let zoom = 1;
const minZoom = 1;
const maxZoom = 3;
let isDragging = false;
let startX = 0, startY = 0;
let translateX = 0, translateY = 0;
let limitX = 0, limitY = 0;

function updateTransform() {
  img.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${zoom})`;
}

function updateDragLimits() {
  if (zoom === 1) {
    limitX = 0;
    limitY = 0;
    return;
  }
  const rect = container.getBoundingClientRect();
  const imgRect = img.getBoundingClientRect();
  
  limitX = (imgRect.width - rect.width) / 2;
  limitY = (imgRect.height - rect.height) / 2;
}

function adjustZoom(amount) {
  const oldZoom = zoom;
  zoom = Math.min(maxZoom, Math.max(minZoom, zoom + amount));
  
  if (zoom === 1) {
    translateX = 0;
    translateY = 0;
  } else {
    translateX = translateX * (zoom / oldZoom);
    translateY = translateY * (zoom / oldZoom);
  }
  updateTransform();
  updateDragLimits();
}

function resetZoom() {
  zoom = 1;
  translateX = 0;
  translateY = 0;
  updateTransform();
  updateDragLimits();
}

// Drag operations
container.addEventListener('mousedown', (e) => {
  if (zoom === 1) return;
  isDragging = true;
  container.style.cursor = 'grabbing';
  updateDragLimits();
  startX = e.clientX - translateX;
  startY = e.clientY - translateY;
  e.preventDefault();
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  
  let newX = e.clientX - startX;
  let newY = e.clientY - startY;
  
  if (limitX > 0) {
    translateX = Math.max(-limitX, Math.min(limitX, newX));
  } else {
    translateX = 0;
  }
  
  if (limitY > 0) {
    translateY = Math.max(-limitY, Math.min(limitY, newY));
  } else {
    translateY = 0;
  }
  
  updateTransform();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
  container.style.cursor = zoom > 1 ? 'grab' : 'default';
});

// Prevent default browser ghost dragging
img.addEventListener('dragstart', e => e.preventDefault());

// Mobile Touch drag events
container.addEventListener('touchstart', (e) => {
  if (zoom === 1 || e.touches.length > 1) return;
  isDragging = true;
  updateDragLimits();
  startX = e.touches[0].clientX - translateX;
  startY = e.touches[0].clientY - translateY;
}, { passive: true });

container.addEventListener('touchmove', (e) => {
  if (!isDragging || e.touches.length > 1) return;
  
  // Prevent browser viewport scrolling only when zoomed in and actively dragging
  if (zoom > 1) {
    if (e.cancelable) e.preventDefault();
  }
  
  let newX = e.touches[0].clientX - startX;
  let newY = e.touches[0].clientY - startY;
  
  if (limitX > 0) translateX = Math.max(-limitX, Math.min(limitX, newX));
  if (limitY > 0) translateY = Math.max(-limitY, Math.min(limitY, newY));
  
  updateTransform();
}, { passive: false }); // Set passive: false to allow e.preventDefault()!

container.addEventListener('touchend', () => {
  isDragging = false;
});

// Switch Tab function
function switchViewerTab(tab) {
  const pngBtn = document.querySelector('.tab-btn[onclick*="png"]');
  const pdfBtn = document.querySelector('.tab-btn[onclick*="pdf"]');
  const pngContent = document.getElementById('png-content');
  const pdfContent = document.getElementById('pdf-content');
  const zoomControls = document.querySelector('.resume-zoom-controls');
  const helpText = document.querySelector('.interactive-help');
  const container = document.querySelector('.resume-viewer-container');

  if (tab === 'png') {
    pngBtn.classList.add('active');
    pdfBtn.classList.remove('active');
    pngContent.style.display = 'block';
    pdfContent.style.display = 'none';
    if (zoomControls) zoomControls.style.display = 'flex';
    if (helpText) helpText.style.display = 'block';
    
    // Restore grab cursor style on image container
    if (container) {
      container.style.cursor = 'grab';
    }
  } else {
    pngBtn.classList.remove('active');
    pdfBtn.classList.add('active');
    pngContent.style.display = 'none';
    pdfContent.style.display = 'block';
    if (zoomControls) zoomControls.style.display = 'none';
    if (helpText) helpText.style.display = 'none';
    
    // Remove grab cursor when viewing PDF
    if (container) {
      container.style.cursor = 'default';
    }
  }
}

// Interactive Button Feedback for download
const downloadLinks = document.querySelectorAll('a[download]');
downloadLinks.forEach(link => {
  link.addEventListener('click', (e) => {
    const originalText = link.innerHTML;
    const hasSvg = link.querySelector('svg');
    const svgHtml = hasSvg ? hasSvg.outerHTML : '';
    
    // Clean text by stripping svg elements to see the label
    const textNode = Array.from(link.childNodes).find(n => n.nodeType === Node.TEXT_NODE);
    const labelText = textNode ? textNode.textContent.trim() : 'Resume';
    
    link.innerHTML = `${svgHtml} Saving...`;
    link.style.borderColor = 'var(--accent-color)';
    link.style.color = 'var(--accent-color)';
    
    setTimeout(() => {
      link.innerHTML = originalText;
      link.style.borderColor = '';
      link.style.color = '';
    }, 2000);
  });
});

// Back to portfolio scroll preservation / history back
const backLink = document.querySelector('.back-link');
if (backLink) {
  backLink.addEventListener('click', (e) => {
    // If the previous page was in the same portfolio domain, go back in history
    if (document.referrer && document.referrer.includes(window.location.host)) {
      e.preventDefault();
      history.back();
    }
  });
}
</script>
